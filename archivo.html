<html lang="es">
<head>
<meta charset="utf-8">

<meta name="description" content="Archivo completo de dossiers de Pieza de Paisaje: espacio, lugar, paisaje, cartografía, ciudad, la mar y poemas — el cuaderno de lectura y campo de Carlos Ceruti Lagos.">
<title>Archivo — Pieza de Paisaje — Carlos Ceruti Lagos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<style>
main{max-width:1440px}
.envoltura{max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,64px)}
.filtros{margin:48px 0 40px;font-family:"IBM Plex Mono",monospace;font-size:.8rem;display:flex;flex-wrap:wrap;gap:0}
.filtros button{
  background:none;border:none;border-bottom:1px solid var(--linea);
  font-family:"IBM Plex Mono",monospace;font-size:.8rem;letter-spacing:.1em;
  color:var(--texto-suave);padding:10px 14px;cursor:pointer;text-transform:uppercase;
  transition:color .25s,border-color .25s;
}
.filtros button:hover{color:var(--enlace-hover)}
.filtros button.activo{color:var(--acento);border-bottom-color:var(--acento)}
.lista{border-top:1px solid var(--linea)}
.fila-archivo{display:grid;grid-template-columns:72px 1fr auto auto;gap:24px;align-items:baseline;padding:16px 8px;border-bottom:1px solid var(--linea);color:var(--texto);transition:background .25s}
.fila-archivo:hover{background:var(--fondo-2);color:var(--texto)}
.fila-archivo .num{font-family:"IBM Plex Mono",monospace;font-size:.8rem;color:var(--acento-tenue)}
.fila-archivo .tit{font-size:1.2rem;font-weight:300}
.fila-archivo .tag{font-family:"IBM Plex Mono",monospace;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--acento-tenue)}
.fila-archivo .anio{font-family:"IBM Plex Mono",monospace;font-size:.8rem;color:var(--texto-suave)}
.nota{margin-top:48px;font-family:"IBM Plex Mono",monospace;font-size:.75rem;color:var(--texto-suave)}
@media (max-width:900px){
  .fila-archivo{grid-template-columns:52px 1fr;row-gap:4px}
}
</style>
</head>
<body>

<svg class="ruido" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2"/></filter>
  <rect width="100%" height="100%" filter="url(#r)"/>
</svg>

<header class="sidebar">
  <div>
    <a href="index.html" class="nombre" style="color:inherit">Carlos Ceruti Lagos</a>
    <div class="sub">PIEZA DE PAISAJE · 2003 - 2026</div>
  </div>
  <nav>
    <a href="index.html#obras"><span class="num">01</span>Obras</a>
    <a href="index.html#proyectos"><span class="num">02</span>Proyectos</a>
    <a href="index.html#artista"><span class="num">03</span>Artista</a>
  </nav>
  <div class="coords"><a href="archivo.html">33°02′S · 71°38′O</a></div>
</header>

<main>
  <div class="envoltura">
    <section>
      <p class="ficha-dossier">Archivo</p>
      <h1>Índice de dossiers</h1>
      <p style="max-width:62ch;color:var(--texto-suave)">Cuaderno de lectura y campo. Cada entrada es un pliegue del dossier al que pertenece.</p>

      <div class="filtros" id="filtros" role="group" aria-label="Filtrar por dossier">
        <button class="activo" data-dossier="TODOS" aria-pressed="true">Todos</button>
        <button data-dossier="ESPACIO" aria-pressed="false">Espacio</button>
        <button data-dossier="LUGAR" aria-pressed="false">Lugar</button>
        <button data-dossier="PAISAJE" aria-pressed="false">Paisaje</button>
        <button data-dossier="CARTOGRAFÍA" aria-pressed="false">Cartografía</button>
        <button data-dossier="CIUDAD" aria-pressed="false">Ciudad</button>
        <button data-dossier="LA MAR" aria-pressed="false">La Mar</button>
        <button data-dossier="LA NOCHE" aria-pressed="false">La Noche</button>
        <button data-dossier="POEMAS" aria-pressed="false">Poemas</button>
      </div>

      <div class="lista" id="lista"></div>

      <p class="nota">Archivo en migración desde el cuaderno original (2014—2026).</p>
    </section>
  </div>
</main>

<script>
(function(){
  "use strict";
  var ENTRADAS = [
    ["Aproximación a la Idea de Espacio —Maderuelo—","ESPACIO","2015","dossiers/espacio-1.html"],
    ["Precisiones Hermenéuticas y Filológicas —Maderuelo—","ESPACIO","2015","dossiers/espacio-2.html"],
    ["Una Historia del Espacio —Maderuelo—","ESPACIO","2016","dossiers/espacio-3.html"],
    ["El Espacio Habitado —Pallasmaa—","ESPACIO","2016","dossiers/espacio-4.html"],
    ["El Espacio como Esencia del Arte —Maderuelo—","ESPACIO","2017","dossiers/espacio-5.html"],
    ["Espacio y Territorio —Renaud—","ESPACIO","2017","dossiers/espacio-6.html"],
    ["Especies de Espacios —Perec—","ESPACIO","2018","dossiers/espacio-7.html"],
    ["El Vacío —Maderuelo—","ESPACIO","2019","dossiers/espacio-8.html"],
    ["Lugares —Nogué—","LUGAR","2014","dossiers/lugar-1.html"],
    ["Lugares Vacíos Paisajes Ignorados —Nogué—","LUGAR","2015","dossiers/lugar-2.html"],
    ["Cuando los Lugares nos Desnudan —Nogué—","LUGAR","2016","dossiers/lugar-3.html"],
    ["Lugar, Sentido de Lugar —Tuan/Nogué—","LUGAR","2016","dossiers/lugar-4.html"],
    ["En los Límites —Nogué—","LUGAR","2017","dossiers/lugar-5.html"],
    ["Los No Lugares —Augé—","LUGAR","2018","dossiers/lugar-6.html"],
    ["Indeterminación —Tiberghien—","LUGAR","2019","dossiers/lugar-7.html"],
    ["Teatro —Turri—","PAISAJE","s/f","dossiers/paisaje-1.html"],
    ["Paisaje Social —Nogué—","PAISAJE","s/f","dossiers/paisaje-2.html"],
    ["Paisajes Híbridos —Nogué—","PAISAJE","s/f","dossiers/paisaje-3.html"],
    ["Micropaisajes —Nogué—","PAISAJE","s/f","dossiers/paisaje-4.html"],
    ["La Otra Mitad del Paisaje —Nogué—","PAISAJE","s/f","dossiers/paisaje-5.html"],
    ["Las Carreteras y el Paisaje —Nogué—","PAISAJE","s/f","dossiers/paisaje-6.html"],
    ["El Retorno al Paisaje","PAISAJE","s/f","dossiers/paisaje-7.html"],
    ["Modelos Fotográficos —Ansón—","PAISAJE","s/f","dossiers/paisaje-8.html"],
    ["El Paisaje como Proyecto —Besse—","PAISAJE","2019","dossiers/paisaje-9.html"],
    ["Las Piscinas Abandonadas —C. Ceruti—","PAISAJE","2019","dossiers/paisaje-10.html"],
    ["El Viandante en el Mapa —Calvino—","CARTOGRAFÍA","2016","dossiers/cartografia-1.html"],
    ["Cartografías de la Emoción","CARTOGRAFÍA","s/f","dossiers/cartografia-2.html"],
    ["Mapas Antiguos —Nogué—","CARTOGRAFÍA","2020","dossiers/cartografia-3.html"],
    ["El Sentido de la Ciudad —Pallasmaa—","CIUDAD","2015","dossiers/ciudad-1.html"],
    ["La Ciudad, Paisaje Invisible —Nel·lo—","CIUDAD","2016","dossiers/ciudad-2.html"],
    ["La Ciudad en la Era de su Reproductibilidad Turística","CIUDAD","s/f","dossiers/ciudad-3.html"],
    ["Intervenciones Urbanas —Brissac—","CIUDAD","2019","dossiers/ciudad-4.html"],
    ["Las Ciudades Invisibles —Calvino—","CIUDAD","2020","dossiers/ciudad-5.html"],
    ["Al Mar no se Llega Tarde —Balcells—","LA MAR","2017","dossiers/la-mar-1.html"],
    ["Acuñar y Apodar —Balcells—","LA MAR","2018","dossiers/la-mar-2.html"],
    ["El Tentempié Esencial —Balcells—","LA MAR","2019","dossiers/la-mar-3.html"],
    ["El Teatro Marino —Balcells—","LA MAR","2021","dossiers/la-mar-4.html"],
    ["El Dormir, la Noche —Blanchot—","LA NOCHE","2015","dossiers/noche-1.html"],
    ["Los Podios Desiertos —Carlos Peirano—","POEMAS","2015"],
    ["Saldo —Sergio Madrid—","POEMAS","2016"],
    ["La Desaparición de una Familia —Juan Luis Martínez—","POEMAS","2017"],
    ["¿Se Puede Enseñar a Morir? —Raúl Ruiz—","POEMAS","2018"],
    ["Arbol —Carlo Bordini—","POEMAS","2019"],
    ["La Ciudad —Kavafis—","POEMAS","2020"],
    ["Ítaca —Kavafis—","POEMAS","2021"]
  ];
  var lista = document.getElementById("lista");
  ENTRADAS.forEach(function(e,i){
    var a = document.createElement("a");
    a.className = "fila-archivo";
    a.href = e[3] || "index.html#dossiers";
    a.setAttribute("data-dossier", e[1]);
    var num = document.createElement("span"); num.className="num";
    num.textContent = "Nº "+("000"+(i+1)).slice(-3);
    var tit = document.createElement("span"); tit.className="tit"; tit.textContent = e[0];
    var tag = document.createElement("span"); tag.className="tag"; tag.textContent = e[1];
    var anio = document.createElement("span"); anio.className="anio"; anio.textContent = e[2];
    a.appendChild(num); a.appendChild(tit); a.appendChild(tag); a.appendChild(anio);
    lista.appendChild(a);
  });
  var botones = document.querySelectorAll("#filtros button");
  botones.forEach(function(b){
    b.addEventListener("click",function(){
      botones.forEach(function(x){x.classList.remove("activo");x.setAttribute("aria-pressed","false");});
      b.classList.add("activo");
      b.setAttribute("aria-pressed","true");
      var d = b.getAttribute("data-dossier");
      document.querySelectorAll(".fila-archivo").forEach(function(f){
        f.style.display = (d==="TODOS" || f.getAttribute("data-dossier")===d) ? "" : "none";
      });
    });
  });
})();
</script>
</body>
</html>
